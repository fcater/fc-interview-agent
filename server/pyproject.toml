[project]
name = "fc-interview-agent-server"
version = "0.1.0"
description = "AI 面试模拟 Agent 后端（FastAPI + LangChain + LangGraph）"
requires-python = ">=3.12"
dependencies = [
    # Web 框架
    "fastapi>=0.141,<1",
    "uvicorn[standard]>=0.52,<1",
    # 配置与校验
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    # 数据库（业务表 + 向量表同库同实例）
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "alembic>=1.19,<2",
    "asyncpg>=0.31,<1",
    # 认证
    "pyjwt>=2.13,<3",
    "bcrypt>=5.0,<6",
    # AI 编排（LangChain 1.x + LangGraph 1.x）
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-openai>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "langchain-postgres>=0.0.17,<1",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # Prompt 模板渲染与结构化日志
    "jinja2>=3.1,<4",
    "loguru>=0.7,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── ruff（lint + format，配置内聚于 pyproject.toml）──────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008：FastAPI Depends 等在默认参数中调用函数的惯用法
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
