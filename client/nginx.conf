# 面试 Agent 前端：SPA 静态托管 + /api 反代到后端容器
# SSE 关键点：proxy_buffering off（token 即时下发）+ 长读超时（本地小模型慢生成）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源 gzip（构建产物已带内容哈希，配合长缓存）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # React Router SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api 反代到 server 服务（compose 内网；SSE 关键配置见下）
    location /api/ {
        # 变量 + Docker 内嵌 DNS 动态解析：server 容器单独重建后 IP 变化也能重新解析，
        # 静态主机名只在配置加载时解析一次，会导致 client 不重建时 502
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://server:8000;
        proxy_pass $upstream;
        # 简历/JD 以 JSON 正文提交，默认 1M 会误杀长简历（413 且响应为 HTML，不符合统一错误结构）
        client_max_body_size 10m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：关闭代理缓冲与缓存，长读超时覆盖整场面试流
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
