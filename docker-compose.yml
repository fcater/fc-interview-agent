# 打包分发用 PostgreSQL（pgvector 镜像）——本地开发不使用 Docker，
# 开发库建在本机 PostgreSQL 上（见 README「本地启动」）
# 用法：cp .env.example .env 并修改密码 → docker compose up -d
# 凭据从根目录 .env 注入（compose 自动读取），缺失即报错
# M7 阶段将扩展为全栈编排（PG + server + client/nginx）
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fc-interview-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在根目录 .env 中配置 POSTGRES_USER（参考 .env.example）}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 中配置 POSTGRES_PASSWORD（参考 .env.example）}
      POSTGRES_DB: ${POSTGRES_DB:?请在根目录 .env 中配置 POSTGRES_DB（参考 .env.example）}
    ports:
      # 宿主机映射端口可配（默认 5433：避免与本机已安装的 PostgreSQL 服务 5432 冲突）
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化时自动创建 vector 扩展
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fc_interview"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
